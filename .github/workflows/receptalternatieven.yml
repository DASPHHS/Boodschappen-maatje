name: Receptalternatieven halfuurlijkse controle
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/receptalternatieven.py'
      - 'src/wereldkeuken_bronnen.py'
      - 'tests/test_receptalternatieven.py'
      - 'tests/test_alternatieven_ui.cjs'
      - 'recepten/alternatieven.html'
      - '.github/workflows/receptalternatieven.yml'
  schedule:
    # Twee controles per uur, buiten het volle uur (UTC).
    # GitHub kan een geplande uitvoering vertragen.
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: receptenalternatieven-halfuur
  cancel-in-progress: false
jobs:
  alternatieven:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benodigde bibliotheken
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Controleer geldigheid, prijswaarheid en filterinterface
        run: |
          python -m compileall -q src/receptalternatieven.py src/wereldkeuken_bronnen.py
          python -m unittest discover -s tests -p 'test_receptalternatieven.py' -v
          node tests/test_alternatieven_ui.cjs
      - name: Controleer een nieuw deel van de receptbronnen en herbereken aanbevelingen
        run: python src/receptalternatieven.py
      - name: Publiceer alternatievenoverzicht
        run: |
          mkdir -p docs/recepten
          cp recepten/alternatieven.html docs/recepten/alternatieven.html
          cp recepten/alternatieven.json docs/recepten/alternatieven.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepten/alternatieven.json docs/recepten/alternatieven.json docs/recepten/alternatieven.html
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git commit -m "Halfuurcontrole receptalternatieven en bronstatus"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::Rebase mislukt"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Alternatieven veilig gepubliceerd"
              exit 0
            fi
            sleep 4
          done
          echo "::error::Publicatie na vier pogingen niet gelukt"
          exit 1
