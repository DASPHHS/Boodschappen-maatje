name: Receptenradar prijzen en recepten
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/receptenradar_v2.py'
      - 'src/brede_maaltijdvarianten.py'
      - 'tests/test_brede_maaltijdvarianten.py'
      - 'src/verpakking_parser.py'
      - 'tests/test_verpakking_parser.py'
      - 'tests/test_jumbo_gewicht_actie.py'
      - 'src/gestructureerde_recepten.py'
      - 'src/receptvarianten_schatting.py'
      - 'src/indicatieve_receptprijzen.py'
      - 'tests/test_indicatieve_receptprijzen.py'
      - 'tests/test_gestructureerde_recepten.py'
      - 'src/shared_hellofresh_hits.py'
      - 'recepten/shared_recipe_hits.js'
      - 'recepten/hello-fresh-kaarten.json'
      - 'recepten/hello-fresh-maart-archief.json'
      - 'recepten/eigen-archief.json'
      - 'src/product_compatibiliteit.py'
      - 'tests/test_product_compatibiliteit.py'
      - 'recepten/watchlist.html'
      - 'recepten/watchlist_engine.js'
      - 'recepten/watchlist_app.js'
      - 'tests/test_receptwatchlist.cjs'
      - 'src/lidl_officiele_acties.py'
      - 'src/scan_kwaliteitscontrole.py'
      - 'src/product_contract.py'
      - 'src/feed_paginering.py'
      - 'tests/test_feed_paginering.py'
      - 'tests/test_product_contract.py'
      - 'tests/test_scan_kwaliteitscontrole.py'
      - 'src/portie_flexibiliteit.py'
      - 'src/verpakkingscombinaties.py'
      - 'tests/test_verpakkingscombinaties.py'
      - 'recepten/boodschappen.html'
      - 'recepten/chat.html'
      - 'tests/test_chatbot.cjs'
      - 'tests/test_filter_contract.cjs'
      - 'tests/test_compact_recept_filters.cjs'
      - 'tests/test_boodschappen_prijsdekking.cjs'
      - 'tests/test_generieke_producten_en_deals.cjs'
      - 'tests/test_portie_flexibiliteit.py'
      - 'tests/test_lidl_officiele_acties.py'
      - 'src/receptenradar_catalog.py'
      - 'src/tonijn_varianten.py'
      - 'tests/test_tonijn_varianten.py'
      - 'src/receptkwaliteit.py'
      - 'src/receptenradar_checks.py'
      - 'src/recepten_ontdekker.py'
      - 'src/actie_receptmatches.py'
      - 'src/recept_keukens.py'
      - 'src/weekmenu_advies.py'
      - 'src/weekly_advice.py'
      - 'config/shopping-agent.json'
      - 'src/actie_maaltijden.py'
      - 'tests/test_actie_maaltijden.py'
      - 'tests/test_receptenradar_v2.py'
      - 'tests/test_receptenradar_checks.py'
      - 'tests/test_actie_receptmatches.py'
      - 'tests/test_recept_keukens.py'
      - 'tests/test_weekmenu_advies.py'
      - 'tests/test_weekly_advice.py'
      - 'tests/test_externe_receptcontrole.py'
      - 'tests/test_toekomstige_acties.py'
      - 'tests/test_weekmenu_ui.cjs'
      - 'tests/test_keuken_filters.cjs'
      - 'tests/test_deal_filters.cjs'
      - 'recepten/index.html'
      - 'recepten/recipe_search.js'
      - 'recepten/persoonlijk_weekmenu.js'
      - 'recepten/recept_inspiratie_radar.js'
      - 'recepten/weekselectie_engine.js'
      - 'recepten/deal_relevantie.js'
      - 'recepten/deal_search.js'
      - 'tests/test_deal_search.cjs'
      - 'tests/test_weekselectie_engine.cjs'
      - 'tests/test_deal_relevantie.cjs'
      - 'tests/test_recept_inspiratie_radar.cjs'
      - 'tests/test_persoonlijk_weekmenu.cjs'
      - 'tests/test_shared_recipe_hits.cjs'
      - 'tests/test_receptzoeker.cjs'
      - 'recepten/status.html'
      - 'tests/test_scan_status.cjs'
      - 'tests/test_mealprep_labels.py'
      - 'tests/test_mealprep_ui.cjs'
      - '.github/workflows/receptenradar.yml'
  schedule:
    # Volledige actieprijzen en receptmandjes twee keer per uur.
    # GitHub kan geplande runs vertragen; geen exacte tijdgarantie.
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: receptenradar-v2
  cancel-in-progress: true
jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer netwerkbibliotheek
        run: python -m pip install 'requests>=2.31,<3'
      - name: Controleer syntax
        run: |
          python -m compileall -q src/verpakkingscombinaties.py src/portie_flexibiliteit.py src/lidl_officiele_acties.py src/scan_kwaliteitscontrole.py src/product_contract.py src/feed_paginering.py src/verpakking_parser.py src/brede_maaltijdvarianten.py src/receptenradar_v2.py src/receptvarianten_schatting.py src/indicatieve_receptprijzen.py src/gestructureerde_recepten.py src/product_compatibiliteit.py src/receptenradar_catalog.py src/tonijn_varianten.py src/receptkwaliteit.py src/receptenradar_checks.py src/recepten_ontdekker.py src/actie_receptmatches.py src/recept_keukens.py src/weekmenu_advies.py src/weekly_advice.py src/actie_maaltijden.py
          python -m unittest discover -s tests -p "test_verpakkingscombinaties.py" -v
          python -m unittest discover -s tests -p "test_portie_flexibiliteit.py" -v
          python -m unittest discover -s tests -p "test_lidl_officiele_acties.py" -v
          python -m unittest discover -s tests -p "test_scan_kwaliteitscontrole.py" -v
          python -m unittest discover -s tests -p "test_product_contract.py" -v
          python -m unittest discover -s tests -p "test_feed_paginering.py" -v
          python -m unittest discover -s tests -p "test_tonijn_varianten.py" -v
          python -m unittest discover -s tests -p "test_receptenradar_v2.py" -v
          python -m unittest discover -s tests -p "test_gestructureerde_recepten.py" -v
          python -m unittest discover -s tests -p "test_indicatieve_receptprijzen.py" -v
          python -m unittest discover -s tests -p "test_product_compatibiliteit.py" -v
          python -m unittest discover -s tests -p "test_jumbo_gewicht_actie.py" -v
          python -m unittest discover -s tests -p "test_verpakking_parser.py" -v
          python -m unittest discover -s tests -p "test_brede_maaltijdvarianten.py" -v
          python -m unittest discover -s tests -p "test_receptenradar_checks.py" -v
          python -m unittest discover -s tests -p "test_actie_maaltijden.py" -v
          python -m unittest discover -s tests -p "test_actie_receptmatches.py" -v
          python -m unittest discover -s tests -p "test_recept_keukens.py" -v
          python -m unittest discover -s tests -p "test_weekmenu_advies.py" -v
          python -m unittest discover -s tests -p "test_weekly_advice.py" -v
          python -m unittest discover -s tests -p "test_toekomstige_acties.py" -v
          python -m unittest discover -s tests -p "test_externe_receptcontrole.py" -v
          python -m unittest discover -s tests -p "test_mealprep_labels.py" -v
      - name: Controleer JavaScript van de receptenwebsite
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("recepten/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise RuntimeError("JavaScript ontbreekt op de receptenwebsite")
          Path("/tmp/receptenradar_check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/receptenradar_check.js
          node tests/test_filter_contract.cjs
          node tests/test_compact_recept_filters.cjs
          node tests/test_receptzoeker.cjs
          node tests/test_receptwatchlist.cjs
          node tests/test_chatbot.cjs
          node tests/test_boodschappen_prijsdekking.cjs
          node tests/test_generieke_producten_en_deals.cjs
          node tests/test_deal_filters.cjs
          node tests/test_keuken_filters.cjs
          node tests/test_weekmenu_ui.cjs
          node tests/test_persoonlijk_weekmenu.cjs
          node tests/test_recept_inspiratie_radar.cjs
          node tests/test_weekselectie_engine.cjs
          node tests/test_deal_relevantie.cjs
          node tests/test_deal_search.cjs
          node tests/test_shared_recipe_hits.cjs
          node tests/test_scan_status.cjs
          node tests/test_mealprep_ui.cjs
      - name: Haal echte schap- en actieprijzen op en bereken recepten
        env:
          PRIJS_PROFEET_KEY: ${{ secrets.PRIJS_PROFEET_KEY }}
        run: |
          python src/receptenradar_v2.py
          python src/shared_hellofresh_hits.py
      - name: Publiceer geverifieerde prijsgegevens naar GitHub Pages
        run: |
          # Receptberekening en bronnenindex zijn TWEE onafhankelijke workflows.
          # Kopieer daarom alleen bestanden die door deze scan zijn gemaakt.
          # Anders kan een vertraagde prijsscan de nieuwere wereldkeukenindex
          # en eigen kookboekindexen per ongeluk weer overschrijven.
          mkdir -p docs/recepten
          cp recepten/shared_recipe_hits.js docs/recepten/shared_recipe_hits.js
          cp recepten/index.html docs/recepten/index.html
          cp recepten/watchlist.html docs/recepten/watchlist.html
          cp recepten/watchlist_engine.js docs/recepten/watchlist_engine.js
          cp recepten/watchlist_app.js docs/recepten/watchlist_app.js
          cp recepten/recipe_search.js docs/recepten/recipe_search.js
          cp recepten/persoonlijk_weekmenu.js docs/recepten/persoonlijk_weekmenu.js
          cp recepten/recept_inspiratie_radar.js docs/recepten/recept_inspiratie_radar.js
          cp recepten/weekselectie_engine.js docs/recepten/weekselectie_engine.js
          cp recepten/deal_relevantie.js docs/recepten/deal_relevantie.js docs/recepten/deal_search.js
          cp recepten/deal_search.js docs/recepten/deal_search.js
          cp recepten/chat.html docs/recepten/chat.html
          cp recepten/boodschappen.html docs/recepten/boodschappen.html
          cp recepten/data.json docs/recepten/data.json
          cp recepten/winkelprijzen.json docs/recepten/winkelprijzen.json
          cp recepten/ontdekte_recepten.json docs/recepten/ontdekte_recepten.json
          cp recepten/status.json docs/recepten/status.json
          cp recepten/status.html docs/recepten/status.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepten/shared-hellofresh-hits.json docs/recepten/shared-hellofresh-hits.json recepten/shared_recipe_hits.js docs/recepten/shared_recipe_hits.js
          git add recepten/data.json recepten/winkelprijzen.json recepten/ontdekte_recepten.json recepten/status.json docs/weekly-advice.json
          git add docs/recepten/recipe_search.js docs/recepten/persoonlijk_weekmenu.js docs/recepten/recept_inspiratie_radar.js docs/recepten/weekselectie_engine.js docs/recepten/deal_relevantie.js
          git add docs/recepten/watchlist.html
          git add docs/recepten/watchlist_engine.js docs/recepten/watchlist_app.js
          git add docs/recepten/index.html docs/recepten/chat.html docs/recepten/boodschappen.html docs/recepten/data.json docs/recepten/winkelprijzen.json docs/recepten/ontdekte_recepten.json docs/recepten/status.json docs/recepten/status.html
          if ! git diff --cached --quiet; then
            git commit -m "Dagelijkse recepten en kassaprijzen bijwerken"
            # Deze commit bevat uitsluitend gegenereerde data en een Pages-kopie.
            # Andere scanners wijzigen dezelfde JSON-bestanden. Bij een rebase
            # behouden we de vers gegenereerde versie in plaats van de oudere
            # remote regels. In 'git rebase' betekent -X theirs de replayed
            # commit (dus ONZE nieuwe gecontroleerde scanoutput).
            for attempt in 1 2 3 4; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                echo "::error::Onverwacht rebaseconflict; geen onvolledige gegevens publiceren."
                git rebase --abort || true
                exit 1
              fi
              # Haal na rebase de nieuwste interface uit de bronbestanden.
              # Een scan gestart vóór een UI-wijziging mag die niet terugdraaien.
              for file in shared_recipe_hits.js index.html watchlist.html watchlist_engine.js watchlist_app.js recipe_search.js chat.html boodschappen.html status.html; do
                cp "recepten/$file" "docs/recepten/$file"
              done
              git add docs/recepten/shared_recipe_hits.js docs/recepten/index.html docs/recepten/watchlist.html docs/recepten/watchlist_engine.js docs/recepten/watchlist_app.js docs/recepten/recipe_search.js docs/recepten/chat.html docs/recepten/boodschappen.html docs/recepten/status.html
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
              if git push origin HEAD:main; then
                echo "Actuele recepten, acties en kassaprijzen succesvol gepubliceerd."
                exit 0
              fi
              sleep 5
            done
            echo "::error::Publicatie mislukt na vier veilige pogingen."
            exit 1
          fi
