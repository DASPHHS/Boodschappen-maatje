name: Receptenradar prijzen en recepten
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/receptenradar_v2.py'
      - 'src/receptenradar_catalog.py'
      - 'src/receptkwaliteit.py'
      - 'src/receptenradar_checks.py'
      - 'src/recepten_ontdekker.py'
      - 'src/actie_maaltijden.py'
      - 'tests/test_actie_maaltijden.py'
      - 'tests/test_receptenradar_v2.py'
      - 'tests/test_receptenradar_checks.py'
      - 'recepten/index.html'
      - '.github/workflows/receptenradar.yml'
  schedule:
    - cron: '31 5 * * *'
permissions:
  contents: write
concurrency:
  group: receptenradar-v2
  cancel-in-progress: true
jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer netwerkbibliotheek
        run: python -m pip install 'requests>=2.31,<3'
      - name: Controleer syntax
        run: |
          python -m compileall -q src/receptenradar_v2.py src/receptenradar_catalog.py src/receptkwaliteit.py src/receptenradar_checks.py src/recepten_ontdekker.py src/actie_maaltijden.py
          python -m unittest discover -s tests -p "test_receptenradar_v2.py" -v
          python -m unittest discover -s tests -p "test_receptenradar_checks.py" -v
          python -m unittest discover -s tests -p "test_actie_maaltijden.py" -v
      - name: Controleer JavaScript van de receptenwebsite
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("recepten/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise RuntimeError("JavaScript ontbreekt op de receptenwebsite")
          Path("/tmp/receptenradar_check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/receptenradar_check.js
      - name: Haal echte schap- en actieprijzen op en bereken recepten
        env:
          PRIJS_PROFEET_KEY: ${{ secrets.PRIJS_PROFEET_KEY }}
        run: python src/receptenradar_v2.py
      - name: Publiceer geverifieerde prijsgegevens naar GitHub Pages
        run: |
          # Werkt bij GitHub Pages bron 'main /root' en 'main /docs'.
          # Synchroniseer ook de pagina's en aanvullende databestanden.
          mkdir -p docs/recepten
          cp -a recepten/. docs/recepten/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepten/data.json recepten/winkelprijzen.json recepten/ontdekte_recepten.json docs/recepten
          if ! git diff --cached --quiet; then
            git commit -m "Dagelijkse recepten en kassaprijzen bijwerken"
            git pull --rebase origin main
            git push
          fi
