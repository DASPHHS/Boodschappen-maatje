name: Dagelijkse Koopkracht Scan
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dagelijks.yml'
      - 'src/buitenkansjes.py'
      - 'src/mail_buitenkansjes.py'
      - 'tests/test_buitenkansjes.py'
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: koopkracht-daily
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntaxcheck en automatische tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Huidige dashboarddata ophalen
        id: dashboard
        continue-on-error: true
        env:
          PRIJS_PROFEET_KEY: ${{ secrets.PRIJS_PROFEET_KEY }}
        run: python src/prijsprofeet_v1.py
      - name: Alle actuele en toekomstige aanbiedingen scannen
        id: deals
        continue-on-error: true
        env:
          PRIJS_PROFEET_KEY: ${{ secrets.PRIJS_PROFEET_KEY }}
        run: python src/buitenkansjes.py
      - name: Publiceer gecontroleerde data
        if: steps.deals.outcome == 'success'
        run: |
          git config user.name "koopkracht-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if ! git diff --cached --quiet; then
            git commit -m "Update dagelijks koopjesdashboard"
            git push
          fi
      - name: Markeer onvolledige data als fout
        if: steps.deals.outcome == 'failure'
        run: |
          echo "::error::AH, Jumbo of Lidl onvolledig. Geen onjuiste dagelijkse e-mail."
          exit 1
      - name: Verzend dagelijkse buitenkansjesmail
        if: github.event_name != 'push'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/mail_buitenkansjes.py
