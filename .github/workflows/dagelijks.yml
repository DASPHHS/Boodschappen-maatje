name: Dagelijkse Koopkracht Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Controleer Python syntax en tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Haal actuele aanbiedingen op via PrijsProfeet API
        id: scan
        continue-on-error: true
        env:
          PRIJS_PROFEET_KEY: ${{ secrets.PRIJS_PROFEET_KEY }}
        run: python src/prijsprofeet_v1.py
      - name: Commit bijgewerkte resultaten
        run: |
          git config user.name "koopkracht-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if ! git diff --cached --quiet; then
            git commit -m "Update folders en dashboard"
            git push
          fi
      - name: Markeer ontbrekende supermarktgegevens als fout
        if: steps.scan.outcome == 'failure'
        run: exit 1
      - name: Verzend overzicht wanneer geconfigureerd
        if: steps.scan.outcome == 'success'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python src/send_email.py
