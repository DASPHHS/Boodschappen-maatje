name: Synchroniseer brede actiecatalogus
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_aanbiedingen.py'
      - 'scripts/sync_lidl_supplemental.py'
      - 'docs/data/lidl-source-registry.json'
      - '.github/workflows/actiecatalogus.yml'
  schedule:
    - cron: '35 5,6 * * *'
permissions:
  contents: write
concurrency:
  group: full-promotions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run only at 07:00 Amsterdam or on demand
        id: gate
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          run=os.getenv("GITHUB_EVENT_NAME")!="schedule" or datetime.now(ZoneInfo("Europe/Amsterdam")).hour==7
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("run="+str(run).lower()+"\n")
          PY
      - name: Compile check
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scripts/sync_aanbiedingen.py scripts/sync_lidl_supplemental.py
          python -m unittest discover -s tests -p 'test_lidl_supplemental.py'
      - name: Read all public promotions
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/sync_aanbiedingen.py
      # This source is independent: it must still execute if PrijsProfeet fails or returns zero beer.
      - name: Check supplemental Lidl beer/folder sources
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/sync_lidl_supplemental.py
      - name: Publish updated catalogue
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/offers-catalog.json docs/data/supplemental-offers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update alle relevante promoties per winkel"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
