name: Synchroniseer brede actiecatalogus
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_aanbiedingen.py'
      - 'scripts/offer-audit.cjs'
      - 'scripts/sync_lidl_supplemental.py'
      - 'scripts/sync_lidl_official.py'
      - 'scripts/promotion_changefeed.py'
      - 'scripts/sync_folderz.py'
      - 'scripts/sync_regular_prices.py'
      - 'scripts/verify_retailer_offers.py'
      - 'scripts/retailer_payloads.py'
      - 'docs/data/personal-prices.json'
      - 'docs/data/watchlist.json'
      - 'docs/product-resolver.js'
      - 'scripts/build_product_resolution.cjs'
      - 'docs/data/lidl-source-registry.json'
      - '.github/workflows/actiecatalogus.yml'
  schedule:
    - cron: '35 5,10,15,19 * * *'
permissions:
  contents: write
concurrency:
  group: full-promotions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: |
          python -m py_compile scripts/sync_aanbiedingen.py scripts/sync_lidl_supplemental.py scripts/sync_regular_prices.py scripts/sync_lidl_official.py
          python -m unittest discover -s tests -p 'test_regular_prices.py'
          python -m unittest discover -s tests -p 'test_lidl_supplemental.py'
          python -m unittest discover -s tests -p 'test_lidl_official.py'
          python -m unittest discover -s tests -p 'test_api_adapters.py'
          python -m unittest discover -s tests -p 'test_shoarma_classification.py'
      - uses: actions/cache/restore@v4
        with:
          path: .sync/promotion-state.json
          key: promotion-cursor-v1-${{ github.run_id }}
          restore-keys: promotion-cursor-v1-
      - name: Read all public promotions
        continue-on-error: true
        run: python scripts/sync_aanbiedingen.py
      # This source is independent: it must still execute if PrijsProfeet fails or returns zero beer.
      - name: Check supplemental Lidl beer/folder sources
        continue-on-error: true
        run: python scripts/sync_lidl_supplemental.py
      - name: Read dated public Lidl product grids and Lidl Plus conditions
        continue-on-error: true
        run: python scripts/sync_lidl_official.py
      - name: Read bounded independent Lidl detail observations
        continue-on-error: true
        run: python scripts/sync_folderz.py
      - name: Recheck known regular prices on retailer product pages
        continue-on-error: true
        run: python scripts/sync_regular_prices.py
      - name: Corroborate imported promotions on exact retailer product pages
        continue-on-error: true
        env:
          RETAILER_VERIFY_LIMIT: ${{ github.event_name == 'push' && '24' || '240' }}
        run: python scripts/verify_retailer_offers.py
      - name: Record coverage and unresolved products
        run: |
          node tests/product-resolver.cjs
          node scripts/build_product_resolution.cjs
      - name: Audit all received promotions
        run: |
          node tests/offer-audit.cjs
          node scripts/offer-audit.cjs
      - name: Publish updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generated JSON files are owned by this job. Avoid rebasing those
          # same large files against a newer main: that creates merge conflicts.
          tmp="$(mktemp -d)"
          cp docs/data/offers-catalog.json "$tmp/offers-catalog.json"
          cp docs/data/retailer-offer-evidence.json "$tmp/retailer-offer-evidence.json"
          cp docs/data/supplemental-offers.json "$tmp/supplemental-offers.json"
          cp docs/data/offer-audit.json "$tmp/offer-audit.json"
          cp docs/data/personal-prices.json "$tmp/personal-prices.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp/offers-catalog.json" docs/data/offers-catalog.json
            python scripts/verify_retailer_offers.py --merge-replay "$tmp/retailer-offer-evidence.json"
            cp "$tmp/supplemental-offers.json" docs/data/supplemental-offers.json
            cp "$tmp/offer-audit.json" docs/data/offer-audit.json
            cp "$tmp/personal-prices.json" docs/data/personal-prices.json
            # The catalog/price monitor may have published newer source data.
            # Resolve coverage from the latest combined files AFTER reset.
            node scripts/audit_product_semantics.cjs
            node scripts/build_product_resolution.cjs
            node scripts/build_product_resolution.cjs --check
            git add docs/data/retailer-offer-evidence.json docs/data/offers-catalog.json docs/data/supplemental-offers.json docs/data/offer-audit.json docs/data/personal-prices.json docs/data/product-resolution.json docs/data/semantic-review.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update alle promoties en aanvullende Lidl-bronnen"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
      # Save cursor only after the matching public feed was successfully committed.
      - uses: actions/cache/save@v4
        if: success() && hashFiles('.sync/promotion-state.json') != ''
        with:
          path: .sync/promotion-state.json
          key: promotion-cursor-v1-${{ github.run_id }}
      - name: Report source availability and explicit fallback after publication
        if: always()
        run: |
          python - <<'PYCODE'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          s=json.load(open('docs/data/supplemental-offers.json'))['stores']['lidl'].get('official_check',{})
          today=datetime.now(ZoneInfo('Europe/Amsterdam')).date().isoformat()
          official=s.get('status')=='ok' and str(s.get('checked_at','')).startswith(today)
          fallback=json.load(open('docs/data/supplemental-offers.json'))['stores']['lidl'].get('folderz_check',{})
          usable=fallback.get('status')=='ok' and str(fallback.get('checked_at','')).startswith(today) and fallback.get('accepted',0)>0
          if not official and usable: print('::warning::Direct Lidl source unavailable; dated Folderz fallback published. Official source remains explicitly partial.')
          feed=json.load(open('docs/data/offers-catalog.json')).get('stores',{}).get('lidl',{})
          api=feed.get('status')=='ok' and str(feed.get('checked_at','')).startswith(today) and len(feed.get('offers',[]))>0
          if api and not (official or usable): print('::warning::Supplementary sources unavailable; current PrijsProfeet API observations published. No full Lidl coverage claimed.')
          assert official or usable or api, {'official':s,'fallback':fallback,'api_status':feed.get('status')}
          PYCODE
