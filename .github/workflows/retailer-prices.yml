name: Officiële winkelprijzen
on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
  push:
    paths: ['src/retailer_prices.py', 'tests/test_retailer_prices.py', '.github/workflows/retailer-prices.yml']
permissions:
  contents: write
concurrency:
  group: retailer-prices
  cancel-in-progress: false
jobs:
  prijzen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_retailer_prices.py' -v
      - run: python src/retailer_prices.py
      - name: Publiceer uitsluitend gescande winkelprijzen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/koopjes/retailer-prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'Werk officiële winkelprijzen bij'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
