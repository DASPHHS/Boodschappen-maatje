name: Open receptenbibliotheek bijwerken
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/receptenbronnen.py'
      - 'src/bronrecepten_verificatie.py'
      - 'src/schema_recept_extractie.py'
      - 'src/wereldkeuken_bronnen.py'
      - 'src/recept_keukens.py'
      - 'tests/test_wereldkeuken_bronnen.py'
      - 'tests/test_inspiratie_filters.cjs'
      - 'tests/test_recept_keukens.py'
      - 'recepten/surinaams-archief.json'
      - 'recepten/hello-fresh-maart-archief.json'
      - 'recepten/hello-fresh-kaarten.json'
      - 'recepten/eigen-archief.json'
      - 'recepten/inspiratie.html'
      - '.github/workflows/receptenbronnen.yml'
  schedule:
    # Incrementele bronontdekking elke 30 minuten, UTC. GitHub kan vertragen.
    # Robotsregels, caching en bronspecifieke limieten blijven van toepassing.
    - cron: '12,42 * * * *'
permissions:
  contents: write
concurrency:
  group: receptenbronnen
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer requests
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Controleer bronlinks, robotstoegang en inspiratie JavaScript
        run: |
          python -m compileall -q src/wereldkeuken_bronnen.py src/schema_recept_extractie.py src/bronrecepten_verificatie.py src/receptenbronnen.py src/recept_keukens.py
          python -m unittest discover -s tests -p 'test_wereldkeuken_bronnen.py' -v
          python -m unittest discover -s tests -p 'test_recept_keukens.py' -v
          node tests/test_inspiratie_filters.cjs
      - name: Verzamel recepttitels, eigen kookboekindexen en toegestane bronlinks
        run: python src/receptenbronnen.py
      - name: Verifieer actuele bronrecepten met volledige hoeveelheden
        run: python src/bronrecepten_verificatie.py
      - name: Synchroniseer naar beide Pages-locaties
        run: |
          mkdir -p docs/recepten
          cp recepten/hello-fresh-kaarten.json docs/recepten/hello-fresh-kaarten.json
          cp recepten/geverifieerde_bronrecepten.json docs/recepten/geverifieerde_bronrecepten.json
          cp recepten/inspiratie.json docs/recepten/inspiratie.json
          cp recepten/inspiratie.html docs/recepten/inspiratie.html
      - name: Bewaar herbruikbare receptenindex
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recepten/hello-fresh-kaarten.json recepten/geverifieerde_bronrecepten.json docs/recepten/geverifieerde_bronrecepten.json
          git add recepten/inspiratie.json docs/recepten/inspiratie.json docs/recepten/inspiratie.html
          if ! git diff --cached --quiet; then
            git commit -m "Open receptenbibliotheek bijwerken"
            for attempt in 1 2 3 4; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "::error::Bronpublicatie heeft een rebaseconflict"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Receptenindex gepubliceerd"
                exit 0
              fi
              sleep 4
            done
            echo "::error::Bronpublicatie mislukt na vier pogingen"
            exit 1
          fi
