name: Open receptenbibliotheek bijwerken
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/receptenbronnen.py'
      - 'recepten/inspiratie.html'
      - '.github/workflows/receptenbronnen.yml'
  schedule:
    - cron: '42 6 * * 1'
permissions:
  contents: write
concurrency:
  group: receptenbronnen
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer requests
        run: python -m pip install 'requests>=2.31,<3'
      - name: Verzamel recepttitels en bronlinks uit openbare toegestane bronnen
        run: python src/receptenbronnen.py
      - name: Bewaar herbruikbare receptenindex
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepten/inspiratie.json
          if ! git diff --cached --quiet; then
            git commit -m "Wekelijkse open receptenbibliotheek"
            git pull --rebase origin main
            git push
          fi
