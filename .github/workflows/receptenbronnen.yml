name: Open receptenbibliotheek bijwerken
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/receptenbronnen.py'
      - 'src/wereldkeuken_bronnen.py'
      - 'tests/test_wereldkeuken_bronnen.py'
      - 'tests/test_inspiratie_filters.cjs'
      - 'recepten/surinaams-archief.json'
      - 'recepten/hello-fresh-maart-archief.json'
      - 'recepten/eigen-archief.json'
      - 'recepten/inspiratie.html'
      - '.github/workflows/receptenbronnen.yml'
  schedule:
    - cron: '42 6 * * *'
permissions:
  contents: write
concurrency:
  group: receptenbronnen
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer requests
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Controleer bronlinks, robotstoegang en inspiratie JavaScript
        run: |
          python -m compileall -q src/wereldkeuken_bronnen.py src/receptenbronnen.py
          python -m unittest discover -s tests -p 'test_wereldkeuken_bronnen.py' -v
          node tests/test_inspiratie_filters.cjs
      - name: Verzamel recepttitels, eigen kookboekindexen en toegestane bronlinks
        run: python src/receptenbronnen.py
      - name: Synchroniseer naar beide Pages-locaties
        run: |
          mkdir -p docs/recepten
          cp recepten/inspiratie.json docs/recepten/inspiratie.json
          cp recepten/inspiratie.html docs/recepten/inspiratie.html
      - name: Bewaar herbruikbare receptenindex
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepten/inspiratie.json docs/recepten/inspiratie.json docs/recepten/inspiratie.html
          if ! git diff --cached --quiet; then
            git commit -m "Wekelijkse open receptenbibliotheek"
            git pull --rebase origin main
            git push
          fi
