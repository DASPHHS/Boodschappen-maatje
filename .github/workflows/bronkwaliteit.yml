name: Controleer bronkwaliteit per winkel
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/bronkwaliteit.py'
      - 'tests/test_bronkwaliteit.py'
      - '.github/workflows/bronkwaliteit.yml'
  schedule:
    - cron: '24,54 * * * *'
permissions:
  contents: write
concurrency:
  group: bronkwaliteit
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax and feed regression
        run: |
          python -m compileall -q src/bronkwaliteit.py
          python -m unittest discover -s tests -p 'test_bronkwaliteit.py' -v
      - name: Generate per-retailer evidence report
        run: python src/bronkwaliteit.py
      - name: Publish evidence without fabricating products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recepten/bronkwaliteit.json
          if ! git diff --cached --quiet; then
            git commit -m "Update per-retailer source quality report"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase -X theirs origin/main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
