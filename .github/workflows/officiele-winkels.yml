name: Officiele aanvullende winkelbronnen
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/officiele_winkelbronnen.py'
      - 'tests/test_officiele_winkelbronnen.py'
      - '.github/workflows/officiele-winkels.yml'
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: officiele-winkels
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer parser
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Controleer parser en broncontract
        run: |
          python -m compileall -q src/officiele_winkelbronnen.py
          python -m unittest discover -s tests -p 'test_officiele_winkelbronnen.py' -v
      - name: Zoek officieel beschikbare producten
        run: python src/officiele_winkelbronnen.py
      - name: Publiceer alleen bronmeldingen, geen onbewezen kortingen
        run: |
          mkdir -p docs/recepten
          cp recepten/officiele-winkels.json docs/recepten/officiele-winkels.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepten/officiele-winkels.json docs/recepten/officiele-winkels.json
          if ! git diff --cached --quiet; then
            git commit -m "Officiele winkeldekking bijwerken"
            for attempt in 1 2 3 4; do
              git pull --rebase -X theirs origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
