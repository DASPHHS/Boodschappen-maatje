name: Prijswatchlist kwaliteit
on:
  workflow_dispatch:
  push:
    paths:
      - "recepten/watchlist.html"
      - "recepten/watchlist_engine.js"
      - "recepten/watchlist_app.js"
      - "tests/test_receptwatchlist.cjs"
      - ".github/workflows/watchlist-ci.yml"
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntaxis
        run: |
          node --check recepten/watchlist_engine.js
          node --check recepten/watchlist_app.js
      - name: Productidentiteit, voedingswaarden, bundels, prijs en favorieten
        run: node tests/test_receptwatchlist.cjs
