name: Lidl bronproef en bewijs
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/lidl_bronproef.py'
      - 'tests/test_lidl_bronproef.py'
      - '.github/workflows/lidl-bronproef.yml'
  schedule:
    - cron: '9,39 * * * *'
permissions:
  contents: write
concurrency:
  group: lidl-bronproef
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Test source probe
        run: |
          python -m compileall -q src/lidl_bronproef.py src/feed_paginering.py
          python -m unittest discover -s tests -p 'test_lidl_bronproef.py' -v
      - name: Probe official price-provider endpoints
        run: python src/lidl_bronproef.py
      - name: Publish status only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recepten/lidl-bronproef.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Lidl endpoint validation evidence"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase -X theirs origin/main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
