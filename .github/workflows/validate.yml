name: Controleer dagelijkse publicatie
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/data/**'
      - 'docs/app.js'
      - 'docs/product-matcher.js'
      - 'docs/price-integrity.js'
      - 'docs/price-observations.js'
      - 'docs/product-resolver.js'
      - 'docs/catalog-search.js'
      - 'docs/style.css'
      - 'scripts/sync_retailer_catalog.py'
      - 'tests/test_retailer_catalog.py'
      - 'tests/catalog-search.cjs'
      - 'tests/live-price-ui.cjs'
      - '.github/workflows/retailer-catalog.yml'
      - 'scripts/build_product_resolution.cjs'
      - 'tests/product-resolver.cjs'
      - 'docs/data/personal-prices.json'
      - 'scripts/sync_regular_prices.py'
      - 'tests/test_regular_prices.py'
      - 'tests/price-observations.cjs'
      - 'docs/source-freshness.js'
      - 'tests/source-freshness.cjs'
      - 'tests/price-integrity.cjs'
      - 'tests/favorite-families.cjs'
      - 'docs/recipe-ranking.js'
      - 'tests/recipe-ranking.cjs'
      - 'docs/offer-identity.js'
      - 'tests/offer-identity.cjs'
      - 'tests/recipe-price-dataset.cjs'
      - 'docs/favorites.js'
      - 'scripts/offer-audit.cjs'
      - 'tests/offer-audit.cjs'
      - 'docs/data/offer-audit.json'
      - 'tests/product-matcher.cjs'
      - 'scripts/validate.mjs'
      - 'scripts/sync_aanbiedingen.py'
      - 'scripts/sync_lidl_supplemental.py'
      - 'docs/data/lidl-source-registry.json'
      - 'docs/data/supplemental-offers.json'
      - 'tests/test_sync_aanbiedingen.py'
      - '.github/workflows/validate.yml'
      - '.github/workflows/product-monitor.yml'
      - '.github/workflows/actiecatalogus.yml'
      - 'tests/workflow-publish-consistency.cjs'
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
permissions:
  contents: read
jobs:
  validatie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controleer brede aanbiedingimport
        run: |
          python -m py_compile scripts/sync_aanbiedingen.py scripts/sync_lidl_supplemental.py
          python -m unittest discover -s tests -p 'test_lidl_supplemental.py'
          python -m unittest discover -s tests -p 'test_sync_aanbiedingen.py'
          python -m unittest discover -s tests -p 'test_regular_prices.py'
          python -m unittest discover -s tests -p 'test_retailer_catalog.py'
      - name: Controleer feedstructuur
        run: |
          node scripts/validate.mjs
          node tests/recipe-engine.cjs
          node tests/product-matcher.cjs
          node tests/price-integrity.cjs
          node tests/price-observations.cjs
          node tests/product-resolver.cjs
          node tests/catalog-search.cjs
          node tests/workflow-publish-consistency.cjs
          node tests/live-price-ui.cjs
          node scripts/build_product_resolution.cjs --check
          node tests/source-freshness.cjs
          node tests/favorite-families.cjs
          node tests/recipe-ranking.cjs
          node tests/offer-identity.cjs
          node tests/recipe-price-dataset.cjs
          node tests/offer-audit.cjs
